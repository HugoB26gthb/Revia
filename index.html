<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="color-scheme" content="light dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Revia">
<title>Revia</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&display=swap">
<style>
/* Style "papier", inspiré de Notion : fond uni, texte presque noir, fins traits gris, aucun dégradé ni lueur.
   Même app que REVIA (nuit) : seules les couleurs, formes et typographies changent.
   Thème "clair" par défaut ; crème, gris et sombre redéfinissent les mêmes variables (data-skin). */
:root{
  --bg:#FFFFFF; --surface:#FFFFFF; --hover:#F7F7F5; --soft:#F1F1EF;
  --text:#37352F; --muted:#787774; --dim:#A5A29A;
  --stroke:rgba(55,53,47,.09); --stroke-hi:rgba(55,53,47,.18);
  --accent:#2383E2; --accent-2:#2383E2; --on-accent:#FFFFFF; --accent-bg:#E7F3F8;
  --ico-fg:#37352F; --chip-on:#E7F3F8;
  --ring-a:#2383E2; --ring-b:#2383E2; --shadow:rgba(15,15,15,.06);
  --up:#448361; --up-bg:#EDF3EC; --down:#D44C47; --down-bg:#FDEBEC; --warn:#CB912F; --warn-bg:#FBF3DB;
  --cyan:#9065B0; --cyan-bg:#F6F3F9;
  --toast-bg:#37352F; --toast-fg:#FFFFFF;
  --glow:transparent;
  --d1:140ms; --d2:220ms; --d3:500ms; --ease:cubic-bezier(.2,.8,.2,1);
  --f:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI Variable Display","Segoe UI","Inter",Helvetica,"Apple Color Emoji",Arial,sans-serif;
  color-scheme:light;
}
:root[data-skin="creme"]{
  --bg:#FBF8F1; --surface:#FFFDF8; --hover:#F4EFE4; --soft:#EFE9DC;
  --text:#3B362E; --muted:#857D70; --dim:#B0A797;
  --stroke:rgba(80,64,40,.11); --stroke-hi:rgba(80,64,40,.22);
  --accent:#B4652F; --accent-2:#B4652F; --accent-bg:#F8E8DC; --chip-on:#F8E8DC;
  --ring-a:#B4652F; --ring-b:#B4652F; --shadow:rgba(60,40,10,.06);
  --toast-bg:#3B362E;
}
:root[data-skin="gris"]{
  --bg:#F7F7F5; --surface:#FFFFFF; --hover:#EFEFED; --soft:#E9E9E7;
  --accent:#37352F; --accent-2:#37352F; --accent-bg:#E9E9E7; --chip-on:#E9E9E7;
  --ring-a:#37352F; --ring-b:#37352F;
}
:root[data-skin="sombre"]{
  --bg:#191919; --surface:#202020; --hover:#252525; --soft:#2C2C2C;
  --text:rgba(255,255,255,.86); --muted:#9B9B9B; --dim:#6F6F6F;
  --stroke:rgba(255,255,255,.08); --stroke-hi:rgba(255,255,255,.16);
  --accent:#529CCA; --accent-2:#529CCA; --on-accent:#FFFFFF; --accent-bg:#1E3A4C; --chip-on:#1E3A4C;
  --ico-fg:rgba(255,255,255,.86);
  --ring-a:#529CCA; --ring-b:#529CCA; --shadow:rgba(0,0,0,.3);
  --up:#4DAB9A; --up-bg:#243D30; --down:#FF7369; --down-bg:#522E2A; --warn:#FFDC49; --warn-bg:#564328;
  --cyan:#9A6DD7; --cyan-bg:#3C2D49;
  --toast-bg:#373737; --toast-fg:#FFFFFF;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{min-height:100%}
html{-webkit-text-size-adjust:100%}
body{margin:0;color:var(--text);font-family:var(--f);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none;-webkit-tap-highlight-color:transparent;background:var(--bg)}
body.paged{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{flex:none}
.screen{max-width:520px;margin:0 auto;padding-inline:18px;padding-block:calc(22px + env(safe-area-inset-top,0px)) 120px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box}

/* typographie */
.h1{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:0;line-height:1.2}
.lead{color:var(--muted);font-size:14px;margin:2px 0 0}
.h2{font-size:14px;font-weight:600;margin:14px 0 -4px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--text)}
.h2 small{font-size:13px;color:var(--muted);font-weight:400}
.h2 button{color:var(--muted);display:flex;align-items:center;gap:2px;font-size:13px;font-weight:400;padding:2px 6px;border-radius:4px}
.h2 button:hover{background:var(--hover)}
.lab{font-size:13px;font-weight:600;color:var(--muted);margin:6px 0 -6px}
.hint{color:var(--muted);font-size:13px;margin:0}
.num{font-variant-numeric:tabular-nums}
/* cartes : plates, un fin trait */
.card{background:var(--surface);border:1px solid var(--stroke);border-radius:10px}
.pad{padding:16px}
.stack{display:flex;flex-direction:column;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.hd-actions{display:flex;gap:6px;align-items:center}
.avatar{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--text);font-weight:600;flex:none;position:relative;transition:background var(--d1) var(--ease)}
.avatar:hover{background:var(--hover)}
.avatar.lg{width:56px;height:56px;font-size:22px;border-radius:12px}
.nbadge{position:absolute;top:-5px;right:-5px;min-width:18px;height:18px;padding:0 5px;box-sizing:border-box;border-radius:999px;background:var(--down);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;border:2px solid var(--bg)}

/* hero : le compte à rebours, aligné à gauche comme un titre de page */
.hero{position:relative;padding:18px 18px 16px;text-align:left}
.jj{font-size:72px;font-weight:700;letter-spacing:-.04em;line-height:1;margin:0 0 6px;color:var(--text);white-space:nowrap}
.jj .mn{margin:0 .02em;color:var(--dim)}
.jj.sm{font-size:48px}
.hero .sub{font-size:15px;font-weight:500}
.hero .date{color:var(--muted);font-size:13px;margin-top:2px}
.road{display:flex;gap:2px;margin-top:16px}
.road i{flex:1;height:6px;border-radius:2px;background:var(--soft);min-width:0}
.road i.p{background:linear-gradient(90deg,var(--accent) 50%,var(--soft) 50%)}
.road i.f{background:var(--accent)}
.road i.x{background:transparent;border:1px dashed var(--stroke-hi);box-sizing:border-box}
.road i.t{outline:2px solid var(--text);outline-offset:1px}
.road-l{display:flex;justify-content:space-between;color:var(--muted);font-size:11.5px;margin-top:6px}
.badges{display:flex;gap:6px;justify-content:flex-start;flex-wrap:wrap;margin-top:14px}
.badges:empty{display:none}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{padding:12px;text-align:left}
.stat span{display:block;font-size:12px;color:var(--muted)}
.stat b{display:block;font-size:22px;font-weight:700;margin-top:2px;white-space:nowrap;letter-spacing:-.01em}
.stat b small{font-size:12px;color:var(--muted);font-weight:400}

/* icônes de matières : petits carrés gris, comme les icônes de pages Notion */
.ico{width:34px;height:34px;border-radius:8px;display:grid;place-items:center;background:var(--soft);color:var(--ico-fg);flex:none}
.ico.sm{width:30px;height:30px;border-radius:7px}
.ico.xl{width:64px;height:64px;border-radius:14px}
.ico.ep{background:var(--cyan-bg);color:var(--cyan)}
.ico.warn{background:var(--warn-bg);color:var(--warn)}

/* séances : lignes de liste */
.sess{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;padding:4px 6px 4px 4px;border-radius:6px;transition:background var(--d1) var(--ease)}
.sess.card{background:transparent;border-color:transparent}
.sess:hover,.sess:active{background:var(--hover)}
.sess+.sess{margin-top:2px}
.sess .open{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:12px;text-align:left;min-height:44px;min-width:0}
.sess .t{min-width:0}
.sess .t b{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;min-width:0;flex-wrap:wrap}
.sess .t small{display:block;color:var(--muted);font-size:12.5px}
.sess.done .t b{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--dim)}
.sess.done .ico{opacity:.5}
.sess.next{background:var(--accent-bg)}
/* case à cocher carrée */
.ck{width:24px;height:24px;margin:5px;border-radius:5px;border:1.5px solid var(--dim);display:grid;place-items:center;color:transparent;flex:none;transition:background var(--d1) var(--ease),border-color var(--d1) var(--ease),transform var(--d1) var(--ease),color var(--d1) var(--ease)}
.ck svg{width:15px;height:15px}
.ck:active{transform:scale(.88)}
.ck.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* étiquettes pastel */
.tag{font-size:12px;font-weight:500;padding:1px 7px;border-radius:4px;background:var(--accent-bg);color:var(--accent);white-space:nowrap;line-height:1.5}
.tag.warn{background:var(--warn-bg);color:var(--warn)}
.tag.ep{background:var(--cyan-bg);color:var(--cyan)}
.chev{color:var(--dim);display:flex}
.dayh{display:flex;justify-content:space-between;align-items:baseline;margin:10px 2px 6px;gap:8px;padding-bottom:6px;border-bottom:1px solid var(--stroke)}
.dayh b{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.dayh span{color:var(--muted);font-size:12.5px;white-space:nowrap}
.free{width:100%;padding:11px 12px;color:var(--dim);font-size:13.5px;border-radius:8px;text-align:left;box-sizing:border-box;transition:background var(--d1) var(--ease)}
.free:hover{background:var(--hover);color:var(--muted)}
.free::before{content:"+ ";font-weight:600}
p.free::before{content:""}
.empty{color:var(--muted);font-size:14px;margin:0;padding:14px 16px}

/* barres fines */
.bar{height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:2px;background:var(--accent);transform-origin:left;animation:growX var(--d3) var(--ease) both}
.brow{display:grid;grid-template-columns:1fr auto;gap:8px 10px;align-items:center;width:100%}
.brow .bar{grid-column:1/-1}
.brow>span{font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.brow>b{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.srow-b{display:grid;grid-template-columns:30px 1fr auto;gap:6px 12px;align-items:center}
.srow-b .bar{grid-column:2/-1}
.srow-b>span:not(.ico){font-size:14px;min-width:0}
.srow-b>b{font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.srow-b .ico{grid-row:span 2}
@keyframes growX{from{transform:scaleX(0)}to{transform:none}}

.ring{display:grid;place-items:center;position:relative}
.ring svg{width:160px;height:160px}
.ring svg circle:first-of-type{stroke:var(--soft)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font-size:32px;font-weight:700;line-height:1;letter-spacing:-.02em}
.ring .in span{color:var(--muted);font-size:12.5px;margin-top:4px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.heat span{font-size:11px;color:var(--muted);text-align:center}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--soft);display:grid;place-items:center;font-style:normal;font-size:11px;color:var(--muted)}
.heat i.l1{background:color-mix(in srgb,var(--accent) 25%,var(--surface))}
.heat i.l2{background:color-mix(in srgb,var(--accent) 55%,var(--surface));color:var(--text)}
.heat i.l3{background:var(--accent);color:var(--on-accent)}
.heat i.t{outline:2px solid var(--text);outline-offset:1px}
.heat i.o{opacity:.35}
.heat i.ex{box-shadow:inset 0 0 0 2px var(--cyan);color:var(--cyan)}

/* calendrier */
.cal-hd{display:flex;justify-content:space-between;align-items:center;padding:0 0 10px}
.cal-hd b{font-weight:600;font-size:15px;text-transform:capitalize}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cal .wd{font-size:11px;color:var(--muted);padding-bottom:4px;font-weight:500}
.cday{aspect-ratio:1;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:14px;min-width:0;transition:background var(--d1) var(--ease)}
.cday:hover{background:var(--hover)}
.cday.out{color:var(--dim)}
.cday.today .num{color:#fff;background:var(--down);border-radius:999px;min-width:22px;line-height:22px;font-weight:600}
.cday.ep{background:var(--cyan-bg);color:var(--cyan);font-weight:600}
.cday.sel{background:var(--soft);box-shadow:inset 0 0 0 1.5px var(--text);color:var(--text)}
.dots{display:flex;gap:3px;height:5px}
.dots i{width:5px;height:5px;border-radius:50%;display:block;background:var(--accent)}
.dots i.e{background:var(--cyan)}
.dots i.l{background:var(--warn)}
.legend{display:flex;gap:6px;flex-wrap:wrap}
.legend .pill i{width:7px;height:7px;border-radius:50%;display:inline-block;background:var(--accent)}

/* onglets segmentés, puces */
.seg{display:flex;gap:2px;padding:3px;border-radius:8px;background:var(--soft);overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;padding:7px 6px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap;min-width:44px;transition:background var(--d1) var(--ease),color var(--d1) var(--ease)}
.seg button.on{color:var(--text);background:var(--surface);box-shadow:0 1px 2px var(--shadow),0 0 0 1px var(--stroke)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:6px;font-size:13px;color:var(--muted);background:var(--soft)}
.pill.hi{color:var(--warn);background:var(--warn-bg);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 10px 6px 8px;border-radius:6px;border:1px solid var(--stroke);background:var(--surface);font-size:13.5px;transition:background var(--d1) var(--ease)}
.chip svg{color:var(--muted)}
.chip.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.chip.on svg{color:var(--accent)}
.iconpick{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.iconpick button{height:44px;border-radius:8px;border:1px solid var(--stroke);display:grid;place-items:center;background:var(--surface);color:var(--muted)}
.iconpick button.on{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}

/* lignes de réglages */
.srow{width:100%;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:9px 12px;text-align:left;border-radius:10px;box-sizing:border-box;transition:background var(--d1) var(--ease)}
.srow.card{background:transparent;border-color:transparent;padding:8px 6px;border-radius:6px}
.srow:hover{background:var(--hover)}
.srow+.srow{margin-top:6px}
.srow .t{min-width:0}
.srow .t b{display:flex;align-items:center;gap:6px;font-weight:500;font-size:14.5px}
.srow .t small{display:block;color:var(--muted);font-size:12.5px}
.srow .v{text-align:right;font-size:14px;font-weight:600;white-space:nowrap}
.msg.unread .t b{font-weight:700}
.msg.unread .ico{background:var(--accent-bg);color:var(--accent)}
.udot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;flex:none}
.switch{width:36px;height:20px;border-radius:999px;background:var(--stroke-hi);position:relative;transition:background var(--d1) var(--ease);flex:none}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform var(--d2) var(--ease)}
.switch.on{background:var(--accent)}
.switch.on::after{transform:translateX(16px)}
.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skin{display:flex;align-items:center;gap:10px;padding:12px;text-align:left}
.skin.on{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.skin .sw{width:24px;height:24px;border-radius:6px;border:1px solid var(--stroke-hi);flex:none}
.obj{display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:center;padding:8px 8px 8px 12px}
.obj+.obj{margin-top:6px}
.obj .t{text-align:left;min-width:0}
.obj .t b{display:block;font-weight:500;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.obj .t small{display:block;color:var(--muted);font-size:12px}
.mini{display:flex;align-items:center;gap:2px}
.mini button{width:30px;height:30px;border-radius:6px;display:grid;place-items:center;color:var(--muted);transition:background var(--d1) var(--ease)}
.mini button:hover{background:var(--hover)}
.tpick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tpick select{-webkit-appearance:auto;appearance:auto;font-size:16px}
.pers .chip{flex:1;justify-content:center;padding:9px 8px}
.mini span{min-width:58px;text-align:center;font-variant-numeric:tabular-nums;line-height:1.2}
.mini span b{display:block;font-size:14.5px;font-weight:600}
.mini span small{display:block;font-size:11px;color:var(--muted)}
/* le plan détaillé de la semaine (message de la boîte de réception) */
.plist{padding:2px 0;overflow:hidden}
.prow{width:100%;display:grid;grid-template-columns:50px 30px 1fr;gap:12px;align-items:center;padding:9px 14px 9px 12px;text-align:left;box-sizing:border-box}
.prow+.prow{border-top:1px solid var(--stroke)}
.prow:hover{background:var(--hover)}
.prow .pt{display:flex;flex-direction:column;font-variant-numeric:tabular-nums;line-height:1.15}
.prow .pt b{font-weight:600;font-size:13.5px}
.prow .pt small{color:var(--muted);font-size:11.5px}
.prow .t b{display:block;font-weight:500;font-size:14.5px}
.prow .t small{display:block;color:var(--muted);font-size:12.5px}
.prow.done{opacity:.5}
p.free{margin:0}
.dnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.dnav b{font-weight:700;font-size:16px}

/* formulaires, boutons */
.field{display:block;width:100%;box-sizing:border-box;padding:10px 12px;border-radius:6px;border:1px solid var(--stroke-hi);background:var(--surface);color:var(--text);min-height:44px;text-align:left;-webkit-appearance:none;appearance:none;transition:box-shadow var(--d1) var(--ease),border-color var(--d1) var(--ease)}
.field:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 20%,transparent)}
.field::-webkit-date-and-time-value{text-align:left}
.field::placeholder{color:var(--dim)}
textarea.field{min-height:96px;resize:vertical;line-height:1.5}
.stepper{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;padding:8px 10px;gap:8px}
.stepper .sb{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;background:var(--soft)}
.stepper .sv{text-align:center;font-size:22px;font-weight:700}
.btn{min-height:44px;border-radius:8px;border:1px solid transparent;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500;padding:0 16px;width:100%;box-sizing:border-box;transition:transform var(--d1) var(--ease),background var(--d1) var(--ease),filter var(--d1) var(--ease)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);color:var(--on-accent)}
.btn.primary:hover{filter:brightness(.94)}
.btn.ghost{background:var(--surface);border-color:var(--stroke-hi);color:var(--text)}
.btn.ghost:hover{background:var(--hover)}
.btn.danger{color:var(--down);background:var(--down-bg)}
.btn.ok{background:var(--up-bg);color:var(--up)}
.btn.sm{min-height:36px;font-size:14px;width:auto;padding:0 12px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2 .btn.sm{width:100%;padding:0 10px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.row3 .btn.sm{width:100%;padding:0 6px;gap:4px;font-size:13px}
.err{color:var(--down);font-size:14px;margin:0}
.warnbox{background:var(--warn-bg);border-color:transparent}
.warnbox b{color:var(--warn);font-weight:600}

/* page séance */
.shead{display:flex;flex-direction:column;align-items:flex-start;text-align:left;gap:6px;padding:8px 0 4px}
.shead h2{margin:6px 0 0;font-size:30px;font-weight:700;letter-spacing:-.02em}
.shead p{margin:0;color:var(--muted);font-size:14px}
/* rappel de 5 min : un "callout" Notion */
.recall{background:var(--soft);border-color:transparent}
.recall b{display:flex;align-items:center;gap:8px;font-weight:600}
.recall .hint{color:var(--muted)}
.reveal{white-space:pre-wrap;background:var(--surface);border:1px solid var(--stroke);border-radius:6px;padding:10px 12px;font-size:14px}
.tip{display:flex;gap:8px;align-items:flex-start}
.tip>span:first-child{color:var(--muted);display:flex;margin-top:1px}
.timer{text-align:left;padding:16px}
.timer .clock{font-size:48px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.timer .ph{color:var(--muted);font-size:12px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.timer .bar{margin:12px 0 4px}
.timer .btn{margin:10px 0 0!important}
.tbanner{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:10px 14px 10px 12px;text-align:left;width:100%;box-sizing:border-box}
.tbanner .clk{font-variant-numeric:tabular-nums;font-size:20px;font-weight:700}

/* ===== barre d'onglets plate ; la "bulle" reste attrapable, mais c'est un simple fond gris ===== */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:0 0 env(safe-area-inset-bottom,0px);pointer-events:none;background:color-mix(in srgb,var(--bg) 92%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-top:1px solid var(--stroke)}
.tabbar-in{pointer-events:auto;position:relative;isolation:isolate;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:5px 8px;touch-action:none}
.tab{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;font-size:10.5px;font-weight:500;color:var(--muted);border-radius:8px;min-width:0;transition:color var(--d2) var(--ease),transform var(--d1) var(--ease)}
.tab svg{width:21px;height:21px}
.tab span,.lens-tab span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.tab.on{color:var(--text);cursor:grab}
.tab:active{transform:scale(.94)}
.tab:focus-visible{outline:2px solid var(--accent);outline-offset:-3px}
.tab-pill{position:absolute;left:0;top:5px;bottom:5px;width:0;z-index:2;pointer-events:none;border-radius:8px;transition:transform 300ms var(--ease),width 300ms var(--ease)}
.tab-pill-in{position:absolute;inset:0;border-radius:inherit}
.tab-pill-body{position:absolute;inset:0;border-radius:inherit;background:var(--soft);transition:transform 200ms var(--ease),box-shadow 200ms var(--ease)}
.tab-pill-lens{position:absolute;inset:0;border-radius:inherit;overflow:hidden}
.lens-row{position:absolute;left:0;top:0;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:5px 8px;box-sizing:border-box;color:var(--text);transition:transform 300ms var(--ease)}
.lens-tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;font-size:10.5px;font-weight:600;min-width:0}
.lens-tab svg{width:21px;height:21px}
.tab-pill-glare{display:none}
.tab-pill.instant,.tab-pill.instant .lens-row{transition:none!important}
.tabbar-in.grabbing,.tabbar-in.grabbing .tab{cursor:grabbing}
/* tenue : le fond se soulève un peu, sans effet de verre */
.tab-pill.dragging .tab-pill-body{transform:scale(1.04,1.08);box-shadow:0 4px 14px var(--shadow),0 0 0 1px var(--stroke)}
.tab.drag-over{color:var(--text)}

/* pages qui s'empilent */
.page{position:fixed;inset:0;z-index:30;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--bg);animation:slide var(--d2) var(--ease) both}
.page .screen{padding-block:calc(8px + env(safe-area-inset-top,0px)) calc(40px + env(safe-area-inset-bottom,0px))}
@keyframes slide{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.phead{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;min-height:44px;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;margin:-6px -18px 0;padding:6px 18px 0;background:var(--bg);border-bottom:1px solid var(--stroke)}
.phead h1{margin:0;font-size:15px;font-weight:600;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.iconbtn{width:36px;height:36px;border-radius:6px;display:grid;place-items:center;color:var(--text);transition:background var(--d1) var(--ease)}
.iconbtn:hover{background:var(--hover)}
.appear>*{animation:rise var(--d2) var(--ease) both}
.appear>*:nth-child(2){animation-delay:20ms}.appear>*:nth-child(3){animation-delay:40ms}.appear>*:nth-child(4){animation-delay:60ms}.appear>*:nth-child(5){animation-delay:80ms}.appear>*:nth-child(n+6){animation-delay:100ms}
@keyframes rise{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}

.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--toast-bg);color:var(--toast-fg);box-shadow:0 6px 20px rgba(0,0,0,.18);padding:9px 14px;border-radius:8px;font-size:14px;width:max-content;max-width:calc(100% - 32px);box-sizing:border-box;
  display:flex;align-items:center;gap:10px;opacity:0;transform:translate(-50%,8px);transition:opacity var(--d2) var(--ease),transform var(--d2) var(--ease);pointer-events:none}
.toast.show{opacity:1;transform:translate(-50%,0)}
.toast-ic{width:20px;height:20px;border-radius:5px;display:grid;place-items:center;flex:none;background:var(--up);color:#fff}
.list{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:10px;font-size:14.5px}
.list b{font-weight:600}
.feat{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;font-size:14.5px}
.foot{text-align:center;color:var(--dim);font-size:12px;margin-top:6px}
.kv{display:flex;justify-content:space-between;gap:12px;font-size:14px}
.kv span{color:var(--muted)}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabbar" aria-label="Navigation"><div class="tabbar-in" id="tabs"></div></nav>
<div id="pages"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============================================================
   REVIA — planning de révision des semestrielles
   Tout est gardé sur l'appareil (localStorage). Une seule page, sans serveur.
   ============================================================ */
const LS = 'revia-v1';
const DEFAULT_EXAM = '2026-12-16';
const DEFAULT_START = '2026-11-16';

/* ---------- icônes (les mêmes que NEXORA) ---------- */
const sv = (p, s = 22, w = 1.6) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`;
const SUBJ = {
  sigma:'<path d="M17 5H7l6 7-6 7h10"/>',
  atom:'<circle cx="12" cy="12" r="1.4" fill="currentColor"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(60 12 12)"/><ellipse cx="12" cy="12" rx="9" ry="3.6" transform="rotate(120 12 12)"/>',
  book:'<path d="M12 6.5c-2-1.4-5-1.8-8-1.2v13c3-.6 6-.2 8 1.2 2-1.4 5-1.8 8-1.2v-13c-3-.6-6-.2-8 1.2zM12 6.5v13"/>',
  flag:'<path d="M5 21V4M5 4.5c3-1.5 6 1.5 9 0s4-1 5 0v8c-1-1-2-1.5-5 0s-6-1.5-9 0"/><path d="M8 7.5h1M11 8.5h1M8 10.5h1M11 11.5h1"/>',
  temple:'<path d="M3 9l9-5 9 5M5 9v9M9.5 9v9M14.5 9v9M19 9v9M3 20h18"/>',
  globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/>',
  shield:'<path d="M12 3l8 3v5c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6z"/><path d="M12 8a4 4 0 1 0 0 8"/>',
  flask:'<path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 15h9"/>',
  leaf:'<path d="M5 19c0-8 5-13 14-14 0 9-5 14-13 14zM5 19l7-7"/>',
  palette:'<path d="M12 3a9 9 0 1 0 0 18c1.3 0 1.6-1 1-2-.6-1.2.2-2.5 1.5-2.5H17a4 4 0 0 0 4-4C21 7 17 3 12 3z"/><circle cx="7.5" cy="11" r="1" fill="currentColor"/><circle cx="10" cy="7" r="1" fill="currentColor"/><circle cx="15" cy="7.5" r="1" fill="currentColor"/>',
  scale:'<path d="M12 4v16M8 20h8M5 7h14M5 7l-3 6a3 3 0 0 0 6 0zM19 7l-3 6a3 3 0 0 0 6 0z"/>',
  frame:'<rect x="4" y="5" width="16" height="14" rx="1.5"/><path d="M4 15l5-5 4 4 3-3 4 4"/>',
  code:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M10 9l-2 2 2 2M14 9l2 2-2 2M8 20h8"/>',
  ball:'<circle cx="12" cy="12" r="9"/><path d="M3.6 9.5c5 1.2 11.8 1.2 16.8 0M3.6 14.5c5-1.2 11.8-1.2 16.8 0M12 3v18"/>',
  mic:'<path d="M12 3a3 3 0 0 0-3 3v5a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3zM6 11a6 6 0 0 0 12 0M12 17v4"/>',
  music:'<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>',
  star:'<path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"/>'
};
const UI = {
  home:'<path d="M4 11l8-7 8 7v9a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/>',
  plan:'<path d="M10 6h10M10 12h10M10 18h10"/><path d="M3.5 6l1.4 1.4L7.5 4.8M3.5 12l1.4 1.4 2.6-2.6M3.5 18l1.4 1.4 2.6-2.6"/>',
  cal:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M4 10h16M8 3v4M16 3v4"/><path d="M8 14h1M11.5 14h1M15 14h1M8 17.5h1M11.5 17.5h1"/>',
  chart:'<path d="M5 20V11M12 20V5M19 20v-6M3 20h18"/>',
  target:'<circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.2" fill="currentColor"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>', minus:'<path d="M5 12h14"/>',
  back:'<path d="M15 5l-7 7 7 7"/>', chev:'<path d="M9 5l7 7-7 7"/>', chevL:'<path d="M15 5l-7 7 7 7"/>',
  check:'<path d="M5 12.5l4.5 4.5L19 7"/>', x:'<path d="M6 6l12 12M18 6L6 18"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  bell:'<path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
  save:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7V3M8 21v-7h8v7"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  pen:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',
  mail:'<rect x="3.5" y="6" width="17" height="12.5" rx="2"/><path d="M4 7l8 6 8-6"/>',
  palette:SUBJ.palette,
  trash:'<path d="M4 7h16M10 7V4h4v3M6 7l1 13h10l1-13"/>',
  download:'<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>',
  play:'<path d="M8 5v14l11-7z" fill="currentColor"/>', stop:'<rect x="7" y="7" width="10" height="10" rx="1.5" fill="currentColor"/>',
  phone:'<rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/>',
  bulb:'<path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"/>',
  reset:'<path d="M4 4v6h6"/><path d="M4.5 15a8 8 0 1 0 1.5-8.5L4 10"/>',
  eye:'<path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/>',
  sliders:'<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
  slots:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5h4"/>',
  hourglass:'<path d="M7 3h10M7 21h10M8 3c0 5 8 5 8 9s-8 4-8 9M16 3c0 5-8 5-8 9"/>',
  report:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 16v1.5M12 12v5.5M15 14v3.5M9 7h6"/>'
};
const ui = (k, s, w) => sv(UI[k], s, w);
const subjIcon = (k, s = 20) => sv(SUBJ[(subj(k) || {}).icon] || SUBJ.star, s, 1.5);

/* ---------- valeurs de départ ---------- */
/* [clé, nom, icône, heures d'objectif, créneaux longs ?, seulement avant l'éval. de langues ?] */
const SUBJ_DEF = [
  ['maths', 'Maths', 'sigma', 14, true, false], ['francais', 'Français', 'book', 12, false, false],
  ['physique', 'Physique', 'atom', 10, true, false], ['economie', 'Économie', 'scale', 8, false, false],
  ['anglais', 'Anglais', 'flag', 7, false, true], ['allemand', 'Allemand', 'flag', 6, false, true],
  ['chimie', 'Chimie', 'flask', 6, false, false], ['histoire', 'Histoire', 'temple', 4, false, false],
  ['info', 'Informatique', 'code', 3, false, false]
];
/* créneaux libres de chaque semaine : [jour (0 = lundi), heure ('' = sans horaire), minutes] */
const SLOTS_DEF = [[0,'13:00',120],[0,'17:30',120],[1,'19:00',30],[2,'09:00',180],[2,'15:00',90],[3,'19:00',30],[4,'09:00',60],[4,'17:30',60],[5,'',180],[6,'',180]];
/* le planning fait à la main : [jour, heure, matière, minutes] */
const WEEK_A = [[0,'13:00','maths',60],[0,'14:00','francais',60],[0,'17:30','anglais',60],[0,'18:30','allemand',60],[1,'19:00','allemand',30],
  [2,'09:00','maths',60],[2,'10:00','physique',60],[2,'11:00','anglais',60],[2,'15:00','economie',60],[2,'16:00','histoire',30],[3,'19:00','anglais',30],
  [4,'09:00','francais',60],[4,'17:30','allemand',60],[5,'','maths',60],[5,'','physique',60],[5,'','anglais',60],
  [6,'','chimie',60],[6,'','francais',30],[6,'','allemand',30],[6,'','economie',30],[6,'','info',30]];
const WEEK_B = [[0,'13:00','maths',60],[0,'14:00','francais',60],[0,'17:30','physique',60],[0,'18:30','economie',60],[1,'19:00','histoire',30],
  [2,'09:00','maths',60],[2,'10:00','francais',60],[2,'11:00','chimie',60],[2,'15:00','physique',60],[2,'16:00','economie',30],[3,'19:00','francais',30],
  [4,'09:00','maths',60],[4,'17:30','francais',60],[5,'','maths',60],[5,'','physique',60],[5,'','histoire',60],
  [6,'','info',60],[6,'','economie',60],[6,'','chimie',60]];
/* thèmes de la version « papier » (réglage séparé de celui de la version nuit : settings.look) */
const SKINS = [['clair', 'Clair', '#FFFFFF'], ['creme', 'Crème', '#FBF8F1'], ['gris', 'Gris', '#F1F1EF'], ['sombre', 'Sombre', '#191919']];
const SKIN_BG = {clair: '#FFFFFF', creme: '#FBF8F1', gris: '#F7F7F5', sombre: '#191919'};
const MILESTONES = [30, 25, 20, 15, 10, 5, 1, 0];
const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];

/* ---------- dates (toujours au format 'AAAA-MM-JJ', heure locale) ---------- */
const pd = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
const addD = (s, n) => { const d = pd(s); return iso(new Date(d.getFullYear(), d.getMonth(), d.getDate() + n)); };
const diffD = (a, b) => Math.round((pd(b) - pd(a)) / 864e5);
const todayS = () => iso(new Date());
const wday = s => (pd(s).getDay() + 6) % 7;
const monday = s => addD(s, -wday(s));
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fmt = (s, o) => pd(s).toLocaleDateString('fr-CH', o);
const dLong = s => cap(fmt(s, {weekday: 'long', day: 'numeric', month: 'long'}));
const dShort = s => cap(fmt(s, {weekday: 'short', day: 'numeric', month: 'short'}));
const dDay = s => fmt(s, {day: 'numeric', month: 'long'}).replace(/^1 /, '1er ');
const nowHM = () => { const n = new Date(); return `${String(n.getHours()).padStart(2, '0')}:${String(n.getMinutes()).padStart(2, '0')}`; };
const addT = (t, m) => { const [h, mi] = t.split(':').map(Number), x = h * 60 + mi + m; return `${String(Math.floor(x / 60) % 24).padStart(2, '0')}:${String(x % 60).padStart(2, '0')}`; };
const isD = s => typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s);

/* ---------- état ---------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function defaultPlan(start){
  const out = [], mon = monday(start);
  for (let w = 0; w < 4; w++) (w < 2 ? WEEK_A : WEEK_B).forEach(([d, t, s, m], i) => out.push({id: uid(), d: addD(mon, w * 7 + d), t, k: i, s, m, done: false, at: null, note: ''}));
  return out;
}
function fresh(){
  return {v: 2, profile: {first: ''}, settings: {skin: 'bleu', notif: false}, exam: DEFAULT_EXAM, planStart: DEFAULT_START, lang: '',
    subjects: SUBJ_DEF.map(([k, name, icon, h, long, lang]) => ({k, name, icon, h, long, lang})),
    slots: SLOTS_DEF.map(([d, t, m]) => ({id: uid(), d, t, m})),
    sessions: defaultPlan(DEFAULT_START), epreuves: [], inbox: {got: {}, read: {}, hidden: {}}, welcomed: false, timer: null};
}
function normalize(s){
  if (!s || typeof s !== 'object' || !Array.isArray(s.sessions)) return null;
  const f = fresh(), out = Object.assign(f, s);
  out.v = 2;
  out.profile = Object.assign({first: ''}, s.profile || {});
  out.settings = Object.assign({skin: 'bleu', notif: false}, s.settings || {});
  if (!isD(out.exam)) out.exam = DEFAULT_EXAM;
  if (!isD(out.planStart)) out.planStart = DEFAULT_START;
  if (!isD(out.lang)) out.lang = '';
  /* version 1 : matières en objet avec couleurs, séances avec un numéro de jour */
  if (!Array.isArray(s.subjects)){
    out.subjects = fresh().subjects;
    if (s.subjects && typeof s.subjects === 'object') out.subjects.forEach(x => { if (s.subjects[x.k] && s.subjects[x.k].name) x.name = s.subjects[x.k].name; });
  } else out.subjects = s.subjects.filter(x => x && x.k).map(x => Object.assign({name: 'Matière', icon: 'star', h: 0, long: false, lang: false}, x));
  out.slots = Array.isArray(s.slots) ? s.slots.filter(x => x && typeof x.d === 'number').map(x => Object.assign({id: uid(), t: '', p: '', m: 60}, x)) : fresh().slots;
  out.sessions = s.sessions.filter(x => x && x.s && (isD(x.d) || typeof x.o === 'number')).map(x => {
    const y = Object.assign({t: '', k: 0, m: 60, done: false, at: null, note: ''}, x, {id: x.id || uid()});
    if (!isD(y.d)) y.d = addD(out.planStart, x.o);
    delete y.o; return y;
  });
  /* deux sortes d'échéances : les semestrielles (kind 'sem') et les évaluations d'avant (kind 'eval') */
  out.epreuves = Array.isArray(s.epreuves) ? s.epreuves.filter(e => e && isD(e.date)).map(e => Object.assign({kind: 'sem', t: '', p: '', title: ''}, e)) : [];

function ringSvg(p, id){

/* ---------- conseils de stratégie (jamais le contenu : c'est toi qui choisis) ---------- */
function phaseTip(){
  const tS = todayS(), left = daysLeft();
  if (left < 0) return {t: 'Les semestrielles sont en cours', d: 'Relis tes fiches la veille de chaque épreuve, dors bien, et rien de nouveau. Tu as fait le travail.'};
  if (left === 0) return {t: 'C’est le jour J', d: 'Pas de nouvelle matière aujourd’hui. Respire, relis tes fiches, et bonne chance !'};
  if (left <= 3) return {t: 'Derniers jours', d: 'Plus rien de nouveau : relis tes fiches et refais les exercices ratés.'};
  if (tS < state.planStart) return {t: 'Avant de commencer', d: `Ton planning démarre ${fmt(state.planStart, {weekday: 'long', day: 'numeric', month: 'long'})}. Prépare tes classeurs et tes fiches pour être prêt dès la première séance.`};
  const ne = evals().find(e => e.date >= tS && e.date < exam());
  if (ne){ const k = diffD(tS, ne.date); return {t: `Évaluation de ${epTitle(ne)} ${k === 0 ? "aujourd'hui" : k === 1 ? 'demain' : `dans ${k} jours`}`, d: `${epTitle(ne)} revient plus souvent jusque-là, sans lâcher les autres matières. Chaque matière revient tous les 2 à 3 jours : c'est la répétition espacée.`}; }
  if (left <= 10) return {t: 'Dernière semaine · conditions réelles', d: 'Entraîne-toi avec d’anciennes semestrielles chronométrées en maths et en physique.'};
  const w = weekIdx(monday(tS));
  if (w < 2) return {t: `Semaine ${w + 1} · c'est parti`, d: "Chaque matière revient tous les 2 à 3 jours : c'est la répétition espacée. Ajoute tes évaluations dans le calendrier pour que l'app en tienne compte."};
  return {t: 'Semestrielles en vue', d: 'Plusieurs matières par jour plutôt qu’un seul gros bloc, et 5 min de rappel au début de chaque séance.'};
}
function sessionTips(s){
  const out = [], left = diffD(s.d, exam()), x = subj(s.s);
  const ep = epSorted().find(e => e.s === s.s && e.date >= s.d);
  if (ep){ const n = diffD(s.d, ep.date), w = isEval(ep) ? 'Évaluation' : 'Semestrielle'; out.push(n === 0 ? `${w} de ${sname(s.s)} ce jour-là.` : `${w} de ${sname(s.s)} ${n === 1 ? 'le lendemain' : `${n} jours plus tard`} (${dDay(ep.date)}).`); }
  if (left <= 3 && left > 0) out.push('Derniers jours : plus rien de nouveau. Relis tes fiches et refais les exercices ratés.');
  else if (left <= 10 && left > 3 && x && x.long) out.push('Dernière semaine : fais une ancienne semestrielle en conditions réelles, chronométrée.');
  if (s.m <= 30) out.push('Créneau court : idéal pour une révision rapide (vocabulaire, définitions, fiches).');
  else if (x && x.long && s.m >= 60) out.push('Créneau long : parfait pour les exercices.');
  return out;
}

function timePick(t){
  const [h, m] = (t || '12:00').split(':');
  const mins = ['00', '15', '30', '45']; if (!mins.includes(m)) mins.push(m);
  return `<div class="tpick"><select class="field" data-in="tp" data-part="h" aria-label="Heure">${Array.from({length: 24}, (_, i) => String(i).padStart(2, '0')).map(x => `<option value="${x}" ${x === h ? 'selected' : ''}>${+x} h</option>`).join('')}</select>

/* ============================================================ rendu */
function render(){
  applySkin();
  syncInbox();
  const app = document.getElementById('app');
  app.innerHTML = tab === 'home' ? homeScreen() : tab === 'plan' ? planScreen() : tab === 'cal' ? calScreen() : tab === 'progress' ? progressScreen() : profileScreen();
  /* l'animation d'apparition seulement quand on change d'onglet, pas à chaque coche */
  if (!animNext){ app.firstElementChild.classList.remove('appear'); app.querySelectorAll('.bar i').forEach(i => i.style.animation = 'none'); }
  animNext = false;
  renderTabs();
  tick();
}
function renderPages(isNew){
  const host = document.getElementById('pages');
  while (host.children.length > stack.length) host.lastElementChild.remove();
  stack.forEach((p, i) => {
    let el = host.children[i];
    if (!el){ el = document.createElement('div'); el.className = 'page'; el.innerHTML = '<div class="screen"></div>'; host.appendChild(el); }
    if (i === stack.length - 1 || isNew){
      el.firstElementChild.innerHTML = PAGES[p.kind](p);
      if (!(isNew && i === stack.length - 1)) el.querySelectorAll('.bar i').forEach(b => b.style.animation = 'none');
    }
  });
  document.body.classList.toggle('paged', stack.length > 0);
  tick();
}
const top_ = () => stack[stack.length - 1];
function refresh(){ save(); render(); if (stack.length) renderPages(); scheduleNotifs(); }

/* pages et historique : le bouton/geste retour du téléphone ferme la page du dessus */
let ignorePop = 0;
function push(p, hist = true){ p.hist = hist; stack.push(p); if (hist) history.pushState({p: stack.length}, ''); renderPages(true); }
function pop(n = 1){
  const removed = stack.splice(Math.max(0, stack.length - n), n), h = removed.filter(p => p.hist).length;
  if (h){ ignorePop++; history.go(-h); }
  afterClose(removed);
  renderPages(); render();
}
addEventListener('popstate', () => {
  if (ignorePop){ ignorePop--; return; }
  if (stack.length && stack[stack.length - 1].hist){ afterClose([stack.pop()]); renderPages(); render(); }
});
/* en quittant la page des créneaux après un changement : planning refait + plan détaillé dans la boîte de réception */
function afterClose(removed){
  if (!state.slotsDirty || !removed.some(p => p.kind === 'slots')) return;
  const n = replan('slots'); save(); scheduleNotifs();
  toast(n ? 'Planning refait · le détail est dans ta boîte de réception' : 'Plus de créneaux libres d’ici aux semestrielles');
}

/* ============================================================ barre d'onglets "verre liquide" (reprise de NEXORA) */
const TABS = [['home', 'Accueil', 'home'], ['plan', 'Planning', 'plan'], ['cal', 'Calendrier', 'cal'], ['progress', 'Progrès', 'chart'], ['profile', 'Profil', 'user']];
function renderTabs(){
  const tb = document.getElementById('tabs');
  if (!tb.dataset.built){
    tb.innerHTML = `<span class="tab-pill" aria-hidden="true"><span class="tab-pill-in"><span class="tab-pill-body"></span><span class="tab-pill-lens"><span class="lens-row">${TABS.map(([k, l, i]) => `<span class="lens-tab">${ui(i, 22)}<span>${l}</span></span>`).join('')}</span></span><span class="tab-pill-glare"></span></span></span>` +
      TABS.map(([k, l, i]) => `<button class="tab" data-act="tab" data-v="${k}">${ui(i, 22)}<span>${l}</span></button>`).join('');
    tb.dataset.built = '1'; tb.dataset.first = '1';
  }
  tb.querySelectorAll('.tab').forEach(b => { const on = b.dataset.v === tab; b.classList.toggle('on', on); if (on) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
  placePill();
}
/* la loupe : une copie de la barre, décalée pour que la bulle montre exactement ce qu'il y a dessous */
function setPill(pill, x, w){
  pill.style.width = w + 'px'; pill.style.transform = `translateX(${x}px)`;
  const row = pill.querySelector('.lens-row'), tb = document.getElementById('tabs');
  const W = tb.clientWidth, H = tb.clientHeight, ph = pill.offsetHeight || H - 12;
  pill.style.setProperty('--gx', (w * .08).toFixed(1) + 'px'); pill.style.setProperty('--gy', (ph * .21).toFixed(1) + 'px');
  row.style.width = W + 'px'; row.style.height = H + 'px';
  row.style.top = Math.round(ph / 2 - H / 2) + 'px';
  row.style.transform = `translateX(${Math.round(-x)}px)`;
}
function placePill(force){
  const tb = document.getElementById('tabs'), pill = tb.querySelector('.tab-pill'), on = tb.querySelector('.tab.on');
  if (!pill || !on || !on.offsetWidth) return;
  const x = on.offsetLeft, w = on.offsetWidth, instant = force || tb.dataset.first === '1' || RM();
  const moved = pill.dataset.x !== undefined && +pill.dataset.x !== x;
  if (instant) pill.classList.add('instant');
  setPill(pill, x, w);
  if (instant){ void pill.offsetWidth; pill.classList.remove('instant'); tb.dataset.first = ''; }
  else if (moved){ pill.classList.remove('moving'); void pill.offsetWidth; pill.classList.add('moving'); clearTimeout(placePill.tm); placePill.tm = setTimeout(() => pill.classList.remove('moving'), 560); }
  pill.dataset.x = x;
}
addEventListener('resize', () => placePill(true));
function goTab(v){
  if (stack.length) pop(stack.length);
  if (v === tab){ scrollTo({top: 0, behavior: 'smooth'}); return; }
  tab = v; animNext = true; render(); scrollTo(0, 0);
}
/* attraper la bulle : elle gonfle, suit le doigt, et en la lâchant elle se pose sur l'onglet le plus proche */
(() => {
  const bar = document.getElementById('tabs');
  let drag = null, suppress = 0;
  const tabsEls = () => [...bar.querySelectorAll('.tab')];
  bar.addEventListener('pointerdown', e => {
    if (e.button > 0) return;
    const pill = bar.querySelector('.tab-pill'), on = bar.querySelector('.tab.on');
    if (!pill || !on) return;
    const br = bar.getBoundingClientRect(), x0 = pill.dataset.x !== undefined ? +pill.dataset.x : on.offsetLeft, w = on.offsetWidth, px = e.clientX - br.left;
    if (px < x0 - 6 || px > x0 + w + 6) return;
    drag = {id: e.pointerId, sx: e.clientX, x0, w, x: x0, active: false};
    try { bar.setPointerCapture(e.pointerId); } catch (_){}
  });
  bar.addEventListener('pointermove', e => {
    if (!drag || e.pointerId !== drag.id) return;
    const pill = bar.querySelector('.tab-pill'), dx = e.clientX - drag.sx;
    if (!drag.active){
      if (Math.abs(dx) < 4) return;
      drag.active = true; pill.classList.remove('moving'); pill.classList.add('dragging', 'instant'); bar.classList.add('grabbing'); buzz(8);
    }
    const T = tabsEls(), min = T[0].offsetLeft, max = T[T.length - 1].offsetLeft;
    drag.x = Math.max(min, Math.min(max, drag.x0 + dx));
    setPill(pill, drag.x, drag.w);
    const c = drag.x + drag.w / 2;
    T.forEach(b => b.classList.toggle('drag-over', Math.abs(b.offsetLeft + b.offsetWidth / 2 - c) < b.offsetWidth / 2));
  });
  const end = e => {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag; drag = null;
    if (!d.active) return;
    suppress = Date.now();
    const pill = bar.querySelector('.tab-pill'), T = tabsEls();
    bar.classList.remove('grabbing'); pill.classList.remove('dragging'); void pill.offsetWidth; pill.classList.remove('instant');
    T.forEach(b => b.classList.remove('drag-over'));
    const c = d.x + d.w / 2, target = T.reduce((best, b) => Math.abs(b.offsetLeft + b.offsetWidth / 2 - c) < Math.abs(best.offsetLeft + best.offsetWidth / 2 - c) ? b : best, T[0]);
    pill.dataset.x = d.x;
    if (target.dataset.v !== tab){ buzz(10); goTab(target.dataset.v); } else placePill();
  };
  bar.addEventListener('pointerup', end);
  bar.addEventListener('pointercancel', end);
  /* un glissé ne doit pas compter aussi comme un toucher sur l'onglet où il finit */
  document.addEventListener('click', e => { if (Date.now() - suppress < 350 && e.target.closest && e.target.closest('#tabs')){ e.stopPropagation(); e.preventDefault(); } }, true);
})();

(() => {
  const EDGE = 28, DUR = 260, EASE = 'cubic-bezier(.2,.8,.2,1)';
  let s = null;
  function start(){
    const pages = document.getElementById('pages').children, n = pages.length, page = pages[n - 1];

  }

    d.page.style.transform = back ? `translateX(${d.W}px)` : '';
    d.under.style.transform = back ? '' : `translateX(${-.3 * d.W}px)`;
    d.shade.style.opacity = back ? 0 : .35;

/* ============================================================ minuteur de séance */
function tick(){
  const tm = state.timer; if (!tm) return;
  const s = byId(tm.id); if (!s){ state.timer = null; save(); return; }
  const el = Math.floor((Date.now() - tm.start) / 1000), totalS = s.m * 60, rec = Math.min(300, totalS);
  let ph, txt; const p = Math.min(1, el / totalS);
  if (el < rec){ ph = 'Rappel sans tes notes'; txt = mmss(rec - el); }
  else if (el < totalS){ ph = 'Séance · temps restant'; txt = mmss(totalS - el); }
  else { ph = 'Séance terminée'; txt = '0:00'; }
  document.querySelectorAll('[data-timer]').forEach(e => e.textContent = txt);
  document.querySelectorAll('[data-timer-ph]').forEach(e => e.textContent = ph);
  document.querySelectorAll('[data-timer-bar]').forEach(e => e.style.width = (p * 100) + '%');
  if (el >= rec && !tm.recallDone){ tm.recallDone = true; save(); buzz(200); }
  if (el >= totalS && !tm.ended){ tm.ended = true; save(); buzz([200, 100, 200]); notify(`${sname(s.s)} : séance terminée`, 'Pense à la cocher et à noter ce que tu as fait.'); toast('Séance terminée !'); }
}
const mmss = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;

let notifTimers = [];
function notify(title, body){
  if (!('Notification' in window) || Notification.permission !== 'granted' || !state.settings.notif) return;
  const opt = {body, icon: 'icons/icon-192.png', badge: 'icons/icon-192.png', tag: title};
  if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.ready.then(r => r.showNotification(title, opt)).catch(() => {});
  else try { new Notification(title, opt); } catch (e){}
}
function scheduleNotifs(){
  notifTimers.forEach(clearTimeout); notifTimers = [];
  if (!state.settings.notif || !('Notification' in window) || Notification.permission !== 'granted') return;
  const now = Date.now(), tS = todayS();
  [tS, addD(tS, 1)].forEach(d => ofDay(d).forEach(s => {
    if (s.done || !s.t) return;
    const [h, m] = s.t.split(':').map(Number), dt = pd(d); dt.setHours(h, m, 0, 0);
    const when = dt.getTime() - now;
    if (when > 0 && when < 864e5 * 2) notifTimers.push(setTimeout(() => notify(`${sname(s.s)} · ${hm(s.t)}`, `C'est l'heure de ta séance (${dur(s.m)}). Commence par 5 min de rappel.`), when));
  }));
}

async function saveFile(name, text, type){
  const blob = new Blob([text], {type}), file = new File([blob], name, {type});
  if (navigator.canShare && navigator.canShare({files: [file]}) && /iPhone|iPad|Android/i.test(navigator.userAgent)){
    try { await navigator.share({files: [file]}); return true; } catch (e){ if (e && e.name === 'AbortError') return false; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 4000);
  return true;
}
function icsText(){
  const dd = s => s.replace(/-/g, '');
  const dt = (s, t) => `${dd(s)}T${t.replace(':', '')}00`;
  const escI = s => String(s).replace(/[\\;,]/g, c => '\\' + c).replace(/\n/g, '\\n');
  const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+Z$/, 'Z');
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//REVIA//Planning//FR', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Révisions semestrielles'];
  const tS = todayS(), days = [...new Set(state.sessions.filter(s => s.d >= tS && !s.done).map(s => s.d))].sort();
  days.forEach(d => {
    const l = ofDay(d).filter(s => !s.done);
    l.filter(s => s.t).forEach(s => {
      const e = addT(s.t, s.m);
      L.push('BEGIN:VEVENT', `UID:${s.id}@revia`, `DTSTAMP:${stamp}`, `DTSTART:${dt(d, s.t)}`, `DTEND:${dt(e < s.t ? addD(d, 1) : d, e)}`,
        `SUMMARY:${escI('Révision · ' + sname(s.s))}`, `DESCRIPTION:${escI('Commence par 5 min de rappel sans tes notes.')}`,
        'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${escI(sname(s.s))}`, 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');
    });
    const free = l.filter(s => !s.t);
    if (free.length) L.push('BEGIN:VEVENT', `UID:blocs-${dd(d)}@revia`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dd(d)}`, `DTEND;VALUE=DATE:${dd(addD(d, 1))}`,
      `SUMMARY:${escI('Révisions (' + dur(total(free)) + ') : ' + free.map(s => sname(s.s) + (PERIODS[s.p] ? ' (' + perLabel(s.p).toLowerCase() + ')' : '')).join(', '))}`,
      'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${escI('Révisions du jour')}`, 'TRIGGER:PT9H', 'END:VALARM', 'END:VEVENT');
  });
  epSorted().filter(e => e.date >= tS).forEach(e => {
    const title = escI(epKind(e) + ' · ' + epTitle(e));
    if (e.t){ const en = addT(e.t, 120); L.push('BEGIN:VEVENT', `UID:ep-${e.id}@revia`, `DTSTAMP:${stamp}`, `DTSTART:${dt(e.date, e.t)}`, `DTEND:${dt(e.date, en < e.t ? '23:59' : en)}`, `SUMMARY:${title}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:-P1D', 'END:VALARM', 'END:VEVENT'); }
    else L.push('BEGIN:VEVENT', `UID:ep-${e.id}@revia`, `DTSTAMP:${stamp}`, `DTSTART;VALUE=DATE:${dd(e.date)}`, `DTEND;VALUE=DATE:${dd(addD(e.date, 1))}`, `SUMMARY:${title}`, 'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${title}`, 'TRIGGER:-PT6H', 'END:VALARM', 'END:VEVENT');
  });
  L.push('END:VCALENDAR');
  return L.join('\r\n');
}

  const el = e.target, k = el.dataset && el.dataset.in; if (!k) return;
  if (k === 'e-d') top_().f.d = el.value;
  else if (k === 'tp'){ const f = top_().f, [h, m] = (f.t || '12:00').split(':'); f.t = el.dataset.part === 'h' ? `${el.value}:${m}` : `${h}:${el.value}`; f.p = ''; renderPages(); }
  else if (k === 'ep-d') top_().f.date = el.value;  else if (k === 'exam' && isD(el.value)){ state.exam = el.value; weekSel = null; refresh(); }
  else if (k === 'planStart' && isD(el.value)){ state.planStart = el.value; weekSel = null; refresh(); }  else if (k === 'bk-file'){
    const pg = top_(), file = el.files && el.files[0]; pg.imp = null; pg.err = '';
    if (!file) return renderPages();
    file.text().then(txt => { let d = null; try { d = normalize(JSON.parse(txt)); } catch (er){} if (d) pg.imp = d; else pg.err = "Ce fichier n'est pas une copie de Revia."; renderPages(); });
  }
});
function welcome(){ push({kind: 'welcome', v: state.profile.first || ''}, false); }

/* ============================================================ démarrage */
/* créneaux changés mais l'app fermée avant de quitter la page : on refait le planning maintenant */
if (state.slotsDirty && state.welcomed){ replan('slots'); save(); }
render();
scheduleNotifs();
if (!state.welcomed) welcome();
if ('serviceWorker' in navigator && location.protocol !== 'file:') addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
